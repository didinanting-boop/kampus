<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Menghilangkan margin bawaan browser dan scrollbar pada body */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Mencegah double scrollbar */
        }

        /* Membuat iframe memenuhi seluruh layar bebas border */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            /* Menghilangkan celah kecil di bagian bawah */
        }
    </style>
</head>

<body>
    <iframe
        src="https://script.google.com/macros/s/AKfycby324xJqbgB67a5pdrCo6E3MbB714_HNRg7rTiR6pWW88XXRX-Eu6vDz-4Rvujppy1J/exec"
        width="560" height="315" frameborder="0" allowfullscreen></iframe>
</body>

</html>
